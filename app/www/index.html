<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>odrig</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="show" hidden>
<div id="state">
<p id="power" class="state">-</p>
<p id="brightness">-</p>
<p id="playing">-</p>
<p id="now" hidden></p>
<p id="fps">-</p>
</div>
<p id="silent" hidden></p>
<p id="silent-why" hidden></p>
<div class="pair">
<button id="on" type="button">On</button>
<button id="off" type="button">Off</button>
</div>
<label for="level">Set the brightness to <span id="level-number">-</span></label>
<input id="level" type="range" min="0" max="255" step="1" value="0">
<button id="play-all" type="button">Playlist from the start</button>
<h1>Animations</h1>
<div id="animations"></div>
<p id="none" hidden>No animation is installed.</p>
</section>
<section id="storage" hidden>
<h1>Storage</h1>
<p id="space">-</p>
<h1>Installed</h1>
<div id="installed"></div>
<p id="installed-none" hidden>No animation is installed.</p>
<h1>Add an animation</h1>
<label id="choose" class="button" for="media">Choose a video or a GIF</label>
<input id="media" type="file" accept="video/*,image/gif" hidden>
<div id="chosen" hidden>
<p id="media-name"></p>
<p>Fit it to the canvas</p>
<div class="three">
<button id="fit-fill" type="button" aria-pressed="true">Fill</button>
<button id="fit-fit" type="button" aria-pressed="false">Fit</button>
<button id="fit-stretch" type="button" aria-pressed="false">Stretch</button>
</div>
<p id="fit-says" class="small"></p>
<label for="start">Start at, in seconds</label>
<input id="start" type="text" inputmode="decimal" autocomplete="off" value="0">
<label for="length">Length in seconds, empty for the rest of the file</label>
<input id="length" type="text" inputmode="decimal" autocomplete="off" value="">
<button id="make" type="button">Make the animation</button>
<p id="making" hidden></p>
<button id="stop-making" type="button" hidden>Stop</button>
<div id="made" hidden>
<canvas id="preview"></canvas>
<p id="made-facts"></p>
<button id="upload" type="button">Upload</button>
<p id="uploading" hidden></p>
<button id="cancel-upload" type="button" hidden>Cancel</button>
</div>
</div>
</section>
<section id="target">
<h1>Target</h1>
<label for="address">Address of the installation</label>
<input id="address" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="pair">
<button id="use" type="button">Use</button>
<button id="board" type="button">Board</button>
</div>
<p id="link" class="state">Checking</p>
<p id="link-failure" hidden></p>
<p id="invalid" hidden></p>
<p id="route"></p>
<p>Join the Wi-Fi network odrig in the phone's Wi-Fi settings.</p>
<p id="about" class="small"></p>
</section>
</main>
<div id="message" hidden>
<p id="message-text"></p>
<button id="message-close" type="button">OK</button>
</div>
<div id="confirm" hidden>
<p id="confirm-text"></p>
<div class="pair">
<button id="confirm-yes" type="button">Remove it</button>
<button id="confirm-no" type="button">Keep it</button>
</div>
</div>
<nav>
<button id="to-show" type="button">Show</button>
<button id="to-storage" type="button">Storage</button>
<button id="to-target" type="button">Target</button>
</nav>
<script type="module" src="main.js"></script>
</body>
</html>
